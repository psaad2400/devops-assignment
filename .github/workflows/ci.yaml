name: Build, Push and Update Manifests

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Image Tag
      run: echo "TAG=${GITHUB_SHA}" >> $GITHUB_ENV

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:${TAG} ./backend

    - name: Build Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:${TAG} ./frontend

    - name: Push Backend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/backend:${TAG}

    - name: Push Frontend Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${TAG}

    - name: Update Kubernetes manifests
      run: |
        sed -i "s|image: .*backend.*|image: ${{ secrets.DOCKER_USERNAME }}/backend:${TAG}|g" k8s/backend.yaml
        sed -i "s|image: .*frontend.*|image: ${{ secrets.DOCKER_USERNAME }}/frontend:${TAG}|g" k8s/frontend.yaml

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add k8s/
        git commit -m "Update image tag to ${TAG}" || echo "No changes"
        git push